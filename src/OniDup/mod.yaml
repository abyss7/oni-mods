title: "OniDup"
description: "A harsher life for duplicants. Thin air and vacuum: breathing depends on the pressure of oxygen, a duplicant in thin air suffers hypoxia, in vacuum passes out within seconds and body fluids boil, a sudden drop of pressure pops the eardrums. An oxygen mask helps in thin air but not in vacuum; only a suit protects there. Works with the gas mixture and pressure mods (oxygen share of a mixture) and without them."
staticID: "abyss.OniDup"
