title: "OniDup"
description: "A harsher life for Duplicants. Breathing now depends on the pressure of Oxygen: thin air makes Duplicants lightheaded and then gasping for air, and in a vacuum they pass out within seconds as the moisture in their bodies boils away. A sudden drop in pressure injures ears and lungs. An Oxygen Mask helps in thin air but not in a vacuum; only a sealed suit like the Atmo Suit protects there. Carbon Dioxide in the air brings stuffiness, headaches and poisoning, and too much Oxygen becomes toxic. Buried Duplicants stay buried until someone digs them out (an option makes them suffocate when buried over the head). Duplicants also dig and build without the hiccups: no more working through a wall that went up on the way, swinging with no progress or leaving a tile half done. Works on its own and with the gas mixture and pressure mods."
staticID: "abyss.OniDup"
